<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Smart Glasses Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-left"></div>
        <div class="auth-right">
            <h1 class="auth-title">Smart Glasses Tracker</h1>
            <p class="auth-subtitle">Welcome back! Please sign in to continue</p>
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <input type="email" id="loginEmail" placeholder="Email" required>
                </div>
                <div class="form-group password-group">
                    <input type="password" id="loginPassword" placeholder="Password" required>
                    <button type="button" class="toggle-password" id="togglePassword">
                        <span class="material-icons">visibility</span>
                    </button>
                </div>
                <button type="submit" class="btn login-btn">Sign In</button>
            </form>
            <p class="switch-form">Don't have an account? <a href="signup.html" class="auth-link">Sign Up</a></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
