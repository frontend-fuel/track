<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Smart Glasses Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-left"></div>
        <div class="auth-right">
            <h1 class="auth-title">Smart Glasses Tracker</h1>
            <p class="auth-subtitle">Create your account to get started</p>
            <form id="signupForm" class="auth-form">
                <div class="form-group">
                    <input type="text" id="signupName" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <input type="email" id="signupEmail" placeholder="Email" required>
                </div>
                <div class="form-group password-group">
                    <input type="password" id="signupPassword" placeholder="Password" required>
                    <button type="button" class="toggle-password" id="toggleSignupPassword">
                        <span class="material-icons">visibility</span>
                    </button>
                </div>
                <div class="form-group password-group">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                    <button type="button" class="toggle-password" id="toggleConfirmPassword">
                        <span class="material-icons">visibility</span>
                    </button>
                </div>
                <button type="submit" class="btn login-btn">Sign Up</button>
            </form>
            <p class="switch-form">Already have an account? <a href="index.html" class="auth-link">Sign In</a></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
