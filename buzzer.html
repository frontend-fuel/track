<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzzer Control - Smart Glasses Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <h2>Smart Glasses Tracker</h2>
        </div>
        <div class="nav-links">
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="#" class="nav-link active">Buzzer Control</a>
            <a href="settings.html" class="nav-link">Settings</a>
            <button id="logoutBtn" class="nav-link">Logout</button>
        </div>
    </nav>
    <div class="dashboard">
        <div class="main-content">
            <h1>Buzzer Control</h1>
            <div class="dashboard-controls buzzer-controls">
                <button class="buzzer-btn buzzer-on" onclick="updateBuzzer(1)">Turn ON (Auto OFF in 15s)</button>
                <button class="buzzer-btn buzzer-off" onclick="updateBuzzer(0)">Turn OFF</button>
                <div id="status" class="buzzer-status">Waiting for action...</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="buzzer.js"></script>
</body>
</html>
